services:
    gjob-postgres:
        image: pgvector/pgvector:pg17
        container_name: gjob-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5433:5432"
        volumes:
            - gjob_postgres_data:/var/lib/postgresql/data

volumes:
    gjob_postgres_data:
